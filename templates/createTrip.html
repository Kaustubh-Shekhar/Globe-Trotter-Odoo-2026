{% extends "base.html" %}
{% block title %}Plan a Trip — GlobeTrotter{% endblock %}

{% block styles %}
<style>
    .form-card { max-width: 620px; margin: 0 auto; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 560px) { .two-col { grid-template-columns: 1fr; } }
    .form-error {
        background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B;
        border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px;
    }
</style>
{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Plan a new trip</h1>
    <p class="muted" style="margin-bottom:20px">
        Start with the basics. You'll add cities and activities next.
    </p>

    {% if error %}
        <div class="form-error">{{ error }}</div>
    {% endif %}

    <div class="card">
        <form method="POST" action="{{ url_for('trips.create_trip') }}">

            <div class="field">
                <label for="name">Trip name</label>
                <input class="input" type="text" id="name" name="name"
                       placeholder="Europe 2026" required
                       value="{{ request.form.get('name', '') }}">
            </div>

            <div class="field">
                <label for="description">Description <span class="muted">(optional)</span></label>
                <textarea class="input" id="description" name="description" rows="3"
                          placeholder="Three cities, ten days, one very tired camera."
                          >{{ request.form.get('description', '') }}</textarea>
            </div>

            <div class="two-col">
                <div class="field">
                    <label for="start_date">Start date</label>
                    <input class="input" type="date" id="start_date" name="start_date"
                           value="{{ request.form.get('start_date', '') }}">
                </div>
                <div class="field">
                    <label for="end_date">End date</label>
                    <input class="input" type="date" id="end_date" name="end_date"
                           value="{{ request.form.get('end_date', '') }}">
                </div>
            </div>

            <div class="field">
                <label for="cover_image">Cover image URL <span class="muted">(optional)</span></label>
                <input class="input" type="url" id="cover_image" name="cover_image"
                       placeholder="https://images.unsplash.com/photo-..."
                       value="{{ request.form.get('cover_image', '') }}">
            </div>

            <div class="row" style="margin-top:18px">
                <button type="submit" class="btn btn-accent">Create trip</button>
                <a class="btn btn-ghost" href="{{ url_for('trips.my_trips') }}">Cancel</a>
            </div>

        </form>
    </div>

</div>

{% endblock %}
